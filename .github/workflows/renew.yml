name: Renew ZenodeHost

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cloakbrowser

      - name: Setup Xray proxy
        env:
          XRAY_CONFIG_JSON: ${{ secrets.XRAY_CONFIG_JSON }}
        run: |
          curl -sL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q xray.zip -d xray
          chmod +x xray/xray
          python -c "import os; open('xray_config.json','w').write(os.environ['XRAY_CONFIG_JSON'])"
          echo "=== Xray config written ==="
          ./xray/xray run -c xray_config.json &
          echo "XRAY_PID=$!" >> $GITHUB_ENV
          sleep 3
          echo "=== Current IP (via proxy) ==="
          curl -s --socks5 127.0.0.1:10808 https://ip.sb
          echo ""

      - name: Run renew
        run: python renew.py --api-only
        env:
          STORAGE_STATE_JSON: ${{ secrets.STORAGE_STATE_JSON }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_SOCKS5: socks5://127.0.0.1:10808

      - name: Commit updated state
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git config user.name "renew-bot[bot]"
          git config user.email "renew-bot@users.noreply.github.com"
          git add storage_state.json
          if git diff --quiet --cached; then
            echo "No changes to commit"
          else
            git commit -m "chore: renew zenode session state"
            git push
          fi

      - name: Cleanup xray
        if: always()
        run: kill ${{ env.XRAY_PID }} 2>/dev/null && echo "Xray stopped" || echo "Xray already stopped"
